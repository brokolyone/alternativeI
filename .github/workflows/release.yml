name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (created if it doesn't exist yet)"
        required: false
        default: "v0.1.0"

jobs:
  build-linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev cmake ninja-build build-essential

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Package .deb
        working-directory: build
        run: cpack -G DEB

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: build/*.deb

  build-windows-installer:
    runs-on: windows-latest
    # Safety net: a previous run's "Package NSIS installer" step hung
    # indefinitely (still running 15+ minutes after Build finished in
    # under 30s) with no way to pull logs from a still-running job to
    # diagnose live. Bound the whole job so a repeat fails fast with a
    # clear timeout instead of silently burning CI minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Prime suspect for the hang above: Windows Defender's real-time
      # scanner doing a full behavioral scan of the freshly-built .exe
      # files (NSIS installer, and the app binaries it packages) - a
      # well-documented source of multi-minute stalls on Windows CI
      # runners that don't affect plain .obj compilation. Exclude the
      # whole workspace before anything gets built or packaged.
      - name: Exclude workspace from Windows Defender scanning
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"
        shell: powershell

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          arch: win64_msvc2019_64

      # cmake -G "Visual Studio 17 2022" relies on CMake's own vswhere-based
      # instance scan, which failed to find VS on this image ("could not
      # find any instance of Visual Studio") despite VS2022 being present -
      # a known flaky spot. Using Ninja with cl.exe/link.exe put on PATH by
      # msvc-dev-cmd sidesteps that detection entirely and is the more
      # standard pattern for MSVC-in-CI anyway.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target alttools diskutil

      # windows-latest doesn't ship NSIS despite earlier docs suggesting
      # otherwise (CPack's NSIS generator failed with "Cannot find NSIS
      # compiler makensis"); Chocolatey is preinstalled on the runner, so
      # use it rather than a third-party action for a two-line install.
      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Package NSIS installer
        working-directory: build
        run: cpack -G NSIS
        timeout-minutes: 6

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          # Narrow to the CPack-produced installer only: build/*.exe would
          # also match the raw alttools.exe/diskutil.exe build outputs
          # sitting next to it, which aren't installers.
          path: build/alttools-*-win64.exe

  publish-release:
    needs: [build-linux-deb, build-windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # On a tag push, github.ref_name is already the tag (e.g. "v0.1.0").
      # On workflow_dispatch there's no tag yet - action-gh-release creates
      # one at the current commit from tag_name below, using this job's
      # own GITHUB_TOKEN (permissions.contents: write above), which is a
      # different credential path than a manual `git push` of a tag.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            artifacts/linux-deb/*.deb
            artifacts/windows-installer/*.exe
          generate_release_notes: true

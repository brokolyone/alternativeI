name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (created if it doesn't exist yet)"
        required: false
        default: "v0.1.0"

jobs:
  build-linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev cmake ninja-build build-essential

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Package .deb
        working-directory: build
        run: cpack -G DEB

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: build/*.deb

  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          arch: win64_msvc2019_64

      # cmake -G "Visual Studio 17 2022" relies on CMake's own vswhere-based
      # instance scan, which failed to find VS on this image ("could not
      # find any instance of Visual Studio") despite VS2022 being present -
      # a known flaky spot. Using Ninja with cl.exe/link.exe put on PATH by
      # msvc-dev-cmd sidesteps that detection entirely and is the more
      # standard pattern for MSVC-in-CI anyway.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target alternative_hacker diskutil

      - name: Package NSIS installer
        working-directory: build
        run: cpack -G NSIS

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/*.exe

  publish-release:
    needs: [build-linux-deb, build-windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # On a tag push, github.ref_name is already the tag (e.g. "v0.1.0").
      # On workflow_dispatch there's no tag yet - action-gh-release creates
      # one at the current commit from tag_name below, using this job's
      # own GITHUB_TOKEN (permissions.contents: write above), which is a
      # different credential path than a manual `git push` of a tag.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            artifacts/linux-deb/*.deb
            artifacts/windows-installer/*.exe
          generate_release_notes: true
